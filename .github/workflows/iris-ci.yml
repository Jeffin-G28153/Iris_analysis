name: Iris Analysis CI

run-name: Iris CI for ${{ github.ref_name }} by ${{ github.actor }}

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iris-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-iris-project:
    name: Test Iris Project
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Display Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Run automated tests
        run: python -m pytest -v

      - name: Run Iris application
        run: python main.py